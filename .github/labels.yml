- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: feature
  color: "0075ca"
  description: New feature (alias for enhancement, more specific)

- name: security
  color: "e4e669"
  description: Security vulnerability or hardening

- name: infrastructure
  color: "c5def5"
  description: DevOps, CI/CD, deployment, hosting

- name: design
  color: "f9d0c4"
  description: Wireframes, UX, accessibility

- name: documentation
  color: "0e8a16"
  description: Documentation updates or additions

- name: api
  color: "bfd4f2"
  description: API routes or contracts

- name: privacy
  color: "d4c5f9"
  description: Touches personal data; adds the project's privacy-regime lens to the gate

- name: web
  color: "e0d3f5"
  description: Web frontend

- name: mobile
  color: "fef2c0"
  description: Mobile app

- name: backend
  color: "d4edda"
  description: Backend services and logic

- name: database
  color: "f0c0f0"
  description: Database schema or migrations

# AREA LABELS FOR A GOVERNANCE REPOSITORY (#188). The six above are product-application areas,
# written for the projects forge-kit is installed INTO. They describe nothing forge-kit itself
# works on, so every ticket filed here blocked at the gate's Step 0b until these existed. They
# route nothing today, deliberately: CLAUDE.md prefers modulating the critic's brief over adding a
# lens, and an area label that changes the review set is a decision to take on its own evidence.
- name: components
  color: "c2e0c6"
  description: An agent, skill, command, hook or shipped shell asset

- name: tooling
  color: "bfdadc"
  description: The guards, scripts and CI that enforce the rules

- name: governance
  color: "d0c6e0"
  description: Templates, labels, ticket standards, the roadmap and the docs that carry them

- name: testing
  color: "fbca04"
  description: Tests, QA, coverage

- name: P0
  color: "b60205"
  description: Critical - blocks release or safety-impacting

- name: P1
  color: "d93f0b"
  description: High priority - important for current milestone

- name: P2
  color: "e4e669"
  description: Medium priority - should do, not blocking

- name: P3
  color: "0e8a16"
  description: Low priority - nice to have

- name: critical
  color: "b60205"
  description: Highest urgency - adds the security lens and maximum scrutiny in ticket-gate

- name: contribution
  color: "7057ff"
  description: Suggested addition or improvement to forge-kit from a downstream project
