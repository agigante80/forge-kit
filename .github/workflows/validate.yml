name: Validate

# Governance CI for the forge-kit marketplace. Makes the version-marker + plugin-structure
# discipline authoritative (a required check), rather than relying on the opt-in local
# .githooks/pre-commit. Modelled on anthropics/claude-plugins-official's validate-plugins.
#
# Runs on EVERY pull_request (no path filter) on purpose: a path-filtered required check
# never reports on PRs that miss the paths, leaving them blocked forever. The job is fast,
# so running it unconditionally is the cost of being a reliable required status check.

# `develop` is listed because work now lands there and merges to main without a PR (2026-09-08).
# Without it the develop branch got NO CI at all, not merely no range guards: `pull_request` never
# fires and `push` only matched main, so every check ran for the first time AFTER the merge. The
# range guards below are still `pull_request`-only and so still run nowhere; #158 covers that
# separately, because it needs a base-ref decision rather than a branch name.
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# Concurrency is deliberately ASYMMETRIC between the two triggers, and collapsing it to one
# shared group would silently lose audits.
#
# Pull requests share a per-ref group and cancel in progress: only the head commit's verdict
# matters, so superseded runs are waste.
#
# Pushes to main get a per-RUN group, which is a group of one, so nothing is ever cancelled.
# A shared group cannot be used here even with cancel-in-progress false, because GitHub cancels
# a PENDING run in a shared group regardless of that flag. A fast series of pushes would then
# drop the intermediate one, and on main each push is a distinct range that the version-bump
# and semver guards audit. Losing it means an unaudited range. Grouping per SHA rather than
# per run is not sufficient either: force-push-to-restore reuses a SHA and collides.
# Kept on ONE line on purpose: a YAML folded scalar (>-) whose continuation lines are indented
# deeper than the first preserves their newlines, which would embed raw newlines in the group name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # The checks are seconds of work; the only slow step is the advisory npm install. A cap well
    # above normal turns a hung runner into a fast failure instead of a six-hour default wait.
    timeout-minutes: 15
    steps:
      # Pinned to a full commit SHA, not a mutable tag: a tag can be repointed, which is the
      # supply-chain risk GitHub's hardening guide names first, and forge-kit ships components
      # that teach exactly this. The trailing comment carries the human-readable version, and
      # .github/dependabot.yml keeps the pin fresh, because a rotted pin is a security claim
      # that quietly stopped being true.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Structural validation (plugin.json + marketplace + version markers)
        run: bash scripts/validate-plugins.sh

      # Anti-drift lock: the work issue-templates must all share one template-version, so
      # the ticket-gate version check stays correct across ticket types.
      - name: Template version lockstep
        run: bash scripts/check-template-lockstep.sh

      # Behavioural gate for the one component that HAS a testable contract. Hooks are the
      # only forge-kit component that can be exercised in isolation: JSON in, decision out.
      - name: Hook contract tests
        run: python3 scripts/test-hooks.py

      - name: Template lockstep guard tests
        run: bash scripts/test-template-lockstep.sh

      # The Precedence list in ticket-standards.md used to certify its own completeness, and was
      # wrong three review rounds running (issue #125). It is now anchored and verified.
      - name: Restatement guard tests
        run: bash scripts/test-check-restatements.sh

      # A producer that emits ticket bodies must resolve the template version at runtime. Two of
      # them hardcoded it and shipped green, because the lockstep guard's scope is the template
      # dir, not the producers (issue #84).
      - name: Producer-stamp guard tests
        run: bash scripts/test-producer-stamps.sh

      # Six sites carry the template-dir resolution order and must agree. They diverged once
      # already, case-grouped against host-grouped, before PR #74 merged (issue #77).
      - name: Template-dir order guard tests
        run: bash scripts/test-template-dir-order.sh

      - name: Template-dir resolution order agrees everywhere
        run: bash scripts/check-template-dir-order.sh

      - name: No hardcoded template-version stamps
        run: bash scripts/check-producer-stamps.sh

      - name: Precedence list matches the gate
        run: bash scripts/check-restatements.sh

      - name: forge-adapt catalogue script tests
        run: bash scripts/test-forge-adapt-catalogue.sh

      # The agents/ directory is a FLAT namespace the Claude Code loader owns, so an agent carries
      # reference material through a companion SKILL named in its `skills:` frontmatter (issue #124).
      # forge-adapt has to install those skills and rewrite the plugin scope, and a skill it misses
      # is skipped SILENTLY at runtime, so the parsing is a tested script rather than prose.
      - name: forge-adapt agent-skills script tests
        run: bash scripts/test-forge-adapt-agent-skills.sh

      # forge-lib.sh is a shipped executable (the forge-host adapter): stubbed-transport
      # contract tests for pagination and label-resolution semantics (issues #62/#63).
      - name: forge-lib contract tests
        run: bash scripts/test-forge-lib.sh

      # check-ticket-mechanics.sh is a shipped executable: ticket-gate Step 3A, which was prose
      # until #149. Its refer paths are the point of the suite, since a naive implementation
      # fails outright where the script must defer to the critic.
      - name: ticket-gate mechanical-checks contract tests
        run: bash scripts/test-check-ticket-mechanics.sh

      - name: Component index tests
        run: bash scripts/test-update-component-index.sh

      # Issue #96: the inventory in README.md and CLAUDE.md is generated from the plugins/ tree.
      # Hand-maintaining it drifted four times in one week, caught only by review agents. This
      # turns that defect class into a build failure.
      - name: Component index freshness (generated regions must match the tree)
        run: python3 scripts/update-component-index.py --check

      - name: Component size guard tests
        run: bash scripts/test-component-size.sh

      # Issue #97: warns above the per-type word budget, fails above the hard ceiling, and holds
      # the three already-oversized components to a ratchet so they can shrink but never grow.
      - name: Component size budget
        run: bash scripts/check-component-size.sh

      # Issue #98 item 3: the local hooks are split by stage, and the pre-push half runs the same
      # range guards CI runs here. It is the only local gate on a direct push to main, which
      # neither range guard below covers (both are pull_request-only).
      # Issue #112: four consumers decide what counts as a component and cannot share one
      # implementation (a glob is not a regex). This is what keeps them agreeing.
      # Issue #76: the last two shipped shell assets with no tests. version-lib.sh is the
      # version<->tag primitive every release lane acts on, so a silent bug there ships a wrong
      # release; release-run.sh is driven with DRY_RUN=1, so no forge and no push is touched.
      # Issue #104: the label taxonomy was declarative with no applier and no checker, so this
      # repo declared 18 labels and held 4. Stubbed transport; touches no forge.
      - name: sync-labels contract tests
        run: bash scripts/test-sync-labels.sh

      - name: version-lib contract tests
        run: bash scripts/test-version-lib.sh

      - name: release-run lane-policy tests
        run: bash scripts/test-release-run.sh

      # The closing-sessions memory helper: a shipped executable whose test existed but was never
      # wired in, so nothing enforced it on a PR.
      - name: closing-sessions memory helper tests
        run: python3 scripts/test-closing-sessions-memory.py

      - name: Component path set agreement
        run: bash scripts/test-component-paths.sh

      # Issue #99, split as #155: forge-kit installs governance into repositories that are usually
      # about to be made public, and shipped nothing that stopped the developer's own machine
      # arriving with them. The scanner runs on forge-kit's own tree for the same reason
      # block-dashes does: a guard the kit does not run on itself is a recommendation.
      - name: Leak-guard contract tests
        run: bash scripts/test-check-public-leaks.sh

      # The IDENTITY half is contract-tested here but never RUN here. It needs the list of private
      # names, and a list of the names you are hiding cannot live in the repository it protects,
      # nor in a CI secret, which is the same disclosure with more readers. The suite builds a
      # throwaway list in a temp directory, so no real name is needed to test it.
      - name: Leak-guard identity-half contract tests
        run: bash scripts/test-check-private-leaks.sh

      - name: No private paths, roots or addresses in the tracked tree
        run: |
          bash plugins/forge-kit-security/skills/leak-guard/assets/check-public-leaks.sh \
            --all --allow-file .leak-guard-allow

      - name: Pre-push hook tests
        run: bash scripts/test-pre-push-hook.sh

      # The pre-commit hook had no contract test until the leak guard was wired into it BELOW its
      # `plugins/` early exit, so a docs-only commit was never scanned and the wiring commit went
      # in unscanned itself. The ordering is the contract this pins down.
      - name: Pre-commit hook tests
        run: bash scripts/test-pre-commit-hook.sh

      # forge-kit-roadmap is an OPTIONAL group holding one opinionated planning method (rolling
      # wave). These four keep it working AND keep it optional: the last one fails the build if
      # anything outside the group references it, because a boundary that is only stated survives
      # until the first convenient reference.
      - name: Roadmap phase guard tests
        run: bash scripts/test-check-phases.sh

      - name: Roadmap sync tests
        run: bash scripts/test-sync-phases.sh

      - name: Group isolation tests
        run: bash scripts/test-check-group-isolation.sh

      - name: forge-kit-roadmap is not referenced from outside itself
        run: bash scripts/check-group-isolation.sh

      # Issue #158: these two were `pull_request`-only, and since work stopped arriving as pull
      # requests they ran on NO path at all. They now run on both, and the base is resolved by a
      # TESTED script rather than a YAML expression, because `github.event.before` is the
      # all-zeroes sha on a created ref and may name a discarded object after a force push. Either
      # would make the guards pass VACUOUSLY, which is worse than the honest gap they had.
      - name: Resolve the range base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "ref=$(bash scripts/resolve-range-base.sh)" >> "$GITHUB_OUTPUT"

      - name: Range-base resolver tests
        run: bash scripts/test-resolve-range-base.sh

      - name: Version-bump discipline (changed component must bump its marker)
        run: bash scripts/check-version-bump.sh "${{ steps.base.outputs.ref }}"

      - name: Plugin-version guard tests
        run: bash scripts/test-check-plugin-version-bump.sh

      # Group-level counterpart of the marker check (issue #79): a changed plugin group must
      # bump its plugin.json semver, the version the marketplace reads for updates.
      - name: Plugin semver discipline (changed group must bump plugin.json)
        run: bash scripts/check-plugin-version-bump.sh "${{ steps.base.outputs.ref }}"

      # Advisory only: layer in the official validator when the CLI is available. Never
      # fails the build (continue-on-error) - our own validate-plugins.sh is the gate.
      - name: Official validation (claude plugin validate, advisory)
        continue-on-error: true
        run: |
          if ! npm install -g @anthropic-ai/claude-code >/dev/null 2>&1; then
            echo "claude CLI could not be installed; skipping advisory validation."; exit 0
          fi
          if claude plugin validate --help >/dev/null 2>&1; then
            claude plugin validate . || echo "claude plugin validate reported issues (advisory)."
          else
            echo "claude plugin validate subcommand unavailable in this CLI version; skipping."
          fi
